name: Deploy to Oracle Cloud (Live)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dao-vang-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Require Oracle Cloud deployment credentials
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_HOST: ${{ secrets.ORACLE_HOST || '161.118.250.182' }}
        run: test -n "$ORACLE_SSH_KEY" && test -n "$ORACLE_HOST"

      - name: Deploy the exact revision that passed CI
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          ORACLE_APP_DIR: ${{ secrets.ORACLE_APP_DIR || '' }}
        with:
          host: ${{ secrets.ORACLE_HOST || '161.118.250.182' }}
          username: ${{ secrets.ORACLE_USER || 'opc' }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          envs: DEPLOY_SHA,ORACLE_APP_DIR
          timeout: 120s
          command_timeout: 30m
          script: |
            set -eu
            APP_DIR="${ORACLE_APP_DIR:-$HOME/dao_vang}"
            cd "$APP_DIR"
            export DAO_VANG_PROJECT_DIR="$APP_DIR"
            test "$(git branch --show-current)" = "main" || {
              echo "Deployment stopped: server checkout is not on main."
              exit 1
            }
            test -z "$(git status --porcelain --untracked-files=no)" || {
              echo "Deployment stopped: preserve and review tracked local changes first."
              exit 1
            }
            git fetch origin main --prune
            git merge --ff-only "$DEPLOY_SHA"
            test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
            test -z "$(git status --porcelain)" || {
              echo "Deployment stopped: unexpected untracked files remain after update."
              exit 1
            }
            export DAO_VANG_RUNTIME_UID="$(id -u)"
            export DAO_VANG_RUNTIME_GID="$(id -g)"
            bash scripts/prepare_runtime_permissions.sh --apply
            docker compose build
            docker compose up -d --no-build --wait --wait-timeout 180
            curl --fail --silent --show-error http://localhost:8000/api/health
            curl --fail --silent --show-error http://localhost:8000/api/ready
            bash scripts/install_production_cron.sh --apply
