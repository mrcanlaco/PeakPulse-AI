[project]
name = "peakpulse-ai"
version = "2.0.0rc2"
description = "PeakPulse AI - Predictive machine learning engine for real-time financial market anomaly detection and time-series analytics"
authors = [{name = "PeakPulse AI Contributors"}]
license = "MIT"
requires-python = "==3.12.*"
dependencies = [
    "pydantic-core==2.46.4",
    "pydantic-settings==2.14.2",
    "pydantic==2.13.4",
    "pyyaml==6.0.3",
    "structlog==26.1.0",
    "typer>=0.27.0",
    "pyarrow>=15.0.0",
    "duckdb>=1.0.0",
    "pytz>=2024.1",
    "streamlit>=1.30.0",
    "scikit-learn>=1.9.0",
    "lightgbm>=4.0.0",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "httpx>=0.28.1",
    "tenacity>=9.1.4",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "websockets>=12.0",
]

[project.scripts]
peakpulse = "dao_vang.cli.main:app"
peakpulse-ui = "dao_vang.web.run:main"
dao-vang = "dao_vang.cli.main:app"
dao-vang-ui = "dao_vang.web.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dao_vang"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "pyright>=1.1.0",
    "tzdata>=2024.1",
]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = ["scripts/"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
