name: Production Health

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dao-vang-production-health
  cancel-in-progress: true

jobs:
  readiness:
    name: Public liveness and readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check web liveness (pulse.freqpilot.dev with legacy fallback during DNS cutover)
        run: |
          if getent hosts pulse.freqpilot.dev >/dev/null 2>&1; then
            TARGET="https://pulse.freqpilot.dev"
          else
            TARGET="https://daovang.comaygiauco.com"
          fi
          echo "Checking liveness on $TARGET/api/health"
          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 20 "$TARGET/api/health"

      - name: Check scanner readiness
        run: |
          if getent hosts pulse.freqpilot.dev >/dev/null 2>&1; then
            TARGET="https://pulse.freqpilot.dev"
          else
            TARGET="https://daovang.comaygiauco.com"
          fi
          echo "Checking readiness on $TARGET/api/ready"
          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 20 "$TARGET/api/ready"
