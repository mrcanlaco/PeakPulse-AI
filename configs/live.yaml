# Single source of truth for the live scanner service.
# Telegram credentials remain in .env and are loaded by AppSettings.

paths:
  data_dir: data_live
  raw_dir: data_live/raw
  normalized_dir: data_live/normalized

web:
  # Link mở thẳng trang phân tích của coin trong Telegram.
  public_url: https://daovang.comaygiauco.com

coingecko:
  # Optional Binance-vs-CoinGecko price cross-reference only.
  enabled: false

coinmarketcap:
  # Standard CoinMarketCap metadata and market cap synced with Binance.
  enabled: true
  timeout_seconds: 10
  cache_minutes: 30

binance_agent_os:
  # Standard market-cap source for token size classification.
  enabled: true
  timeout_seconds: 10
  cache_minutes: 15
  chain_ids: "1,56,8453,CT_501"

collection:
  # Keep network workers bounded so collector responses do not accumulate in
  # memory while DuckDB is rebuilding the derived tables.
  max_concurrency: 6

scanner:
  enabled: true
  # Telegram is enabled as a reference/reporting channel. No order execution
  # exists in this application; the user makes all decisions manually.
  # Fail closed during the v1 -> v2 target migration. Re-enable shadow/canary
  # only after scanner.frozen_model_id points to a calibrated 20%/24h bundle.
  operating_mode: shadow
  poll_interval_minutes: 5
  # Keep the live cycle bounded so DuckDB is not held by a long collector
  # batch. Increase only after measuring a larger watchlist separately.
  max_coins: 150
  min_volume_usd: 1000000
  # Cooldown prevents spamming duplicate alerts for the same coin.
  cooldown_minutes: 120
  telegram_cooldown_minutes: 120
  alert_levels: ["CAO"]
  frozen_model_id: "frozen_20260906_105716_bc3c369b"
  db_path: data_live/live.duckdb
  artifact_dir: artifacts
  watchlist_path: data_live/watchlist.json
  kill_switch_path: data_live/scanner_kill_switch.json
  rollback_state_path: data_live/scanner_rollback.json
  health_report_path: data_live/scanner_health.json
  threshold_policy_version: "frozen_threshold_v1"
  max_heartbeat_age_minutes: 15
  history_days: 30
  # Shadow Telegram delivery: respects cooldown, probability threshold, and volume gates.
  shadow_telegram_enabled: true
  # The new frozen bundle's calibrated probabilities are in the 0.20–0.30
  # range.  Rank inside this validated threshold; do not present it as a
  # literal 75% win-rate guarantee.
  telegram_min_probability: 0.20
  # Minimum 24h volume for Telegram alerts (avoids low liquidity spam).
  telegram_min_volume_usd: 500000
  # Telegram only reports confirmed distribution signals. WATCH stays in the UI.
  telegram_tiers: ["HIGH_CONFIDENCE"]
  # Send a small ranked digest per cycle when multiple coins are detected.
  telegram_digest_mode: true
  global_daily_alert_limit: 18
  coin_daily_alert_limit: 1
  telegram_daily_target_min: 0
  telegram_max_per_cycle: 3
  max_feature_age_minutes: 25
  min_data_quality_score: 0.8
  scan_mode: gainers
  # Broaden discovery to catch distribution setups that are developing before
  # a 5% 24h move; downstream model/evidence/liquidity gates remain strict.
  min_price_change_pct: 10.0
  include_btc: true
  exclude_stablecoins: true
  # Meta-labeling stays off until a real, checksum-pinned artifact is present
  # on the live mount.  An absent model must not be reported as an active
  # quality filter.
  enable_meta_labeling: "disabled"
  meta_model_path: null
  meta_model_min_confidence: 0.5
  # Regime Gate: filter signals to only fire during validated market regimes
  regime_gate_enabled: false
  regime_gate_allowed: ["SIDEWAY_DISTRIBUTION", "TRENDING_BEAR"]

self_learning:
  enabled: true
  check_interval_cycles: 12
  recent_window_days: 14
  recent_sample_weight: 2.0
  historical_max_rows: 100000
  state_path: artifacts/self_learning/live_state.json
  report_dir: artifacts/self_learning/live_runs

# Single candidate-filter policy: keep the validated V1 production lane.
# V2 did not pass the promotion gate and is no longer run in shadow.
candidate_comparison:
  enabled: true
  champion_version: pump_filter_v1
  challenger_version: candidate_filter_v2
  universe_size: 150
  max_candidates: 30
  max_workers: 4
  decision_interval_minutes: 15
  outcome_check_interval_cycles: 3
  horizon_hours: 24
  # New v2 truth contract: a 20% drawdown within 24h. The active frozen v1
  # bundle remains historical evidence and must be retrained before promotion.
  target_drawdown: 0.20
  max_adverse_excursion: 0.16
  gap_tolerance_minutes: 15
  metrics_window_days: 30
  min_resolved: 200
  min_positive_events: 50
  min_evaluation_days: 14
  truth_event_gap_minutes: 240
  min_challenger_event_recall: 0.80
  precision_at_10_relative_gain: 0.10
  max_recall_regression: 0.05
  snapshot_path: data_live/candidate_filter_comparison.json
  state_path: data_live/candidate_filter_v2_state.json

scoring:
  alert_score_threshold: 40.0

threshold:
  version: frozen_threshold_v1
  high_confidence_min_prob: 0.41
  watch_min_prob: 0.20
  high_confidence_min_evidence_groups: 2

# Router chon cach vao lenh, tach biet voi model phat hien tin hieu.
# "rules" la champion; doi sang "shadow_model" de ghi challenger ma khong tac dong quyet dinh.
execution_policy:
  enabled: true
  advisory_only: true
  router_version: scale_in_router_v1
  feature_schema_version: execution_profile_features_v1
  required_label_version: distribution_short_v2
  require_matching_label: true
  selector_mode: rules
  fallback_policy_id: scale_in_balanced
  compact_policy_id: scale_in_compact
  deep_policy_id: scale_in_deep_squeeze
  min_signal_score: 55.0
  min_quality_score: 80.0
  min_liquidity_score: 35.0
  compact_volatility_max: 60.0
  deep_volatility_min: 90.0
  deep_squeeze_min: 75.0
  deep_signal_min: 75.0
  skip_volatility_min: 97.0
  target_drawdown: 0.20
  templates:
    - policy_id: scale_in_compact
      version: "1.0"
      entry_offsets: [0.0, 0.03, 0.06]
      allocations: [0.20, 0.30, 0.50]
      hard_stop_pct: 0.12
      scale_in_hours: 6
      horizon_hours: 24
      risk_multiplier: 1.0
    - policy_id: scale_in_balanced
      version: "1.0"
      entry_offsets: [0.0, 0.05, 0.10]
      allocations: [0.20, 0.30, 0.50]
      hard_stop_pct: 0.16
      scale_in_hours: 6
      horizon_hours: 24
      risk_multiplier: 0.75
    - policy_id: scale_in_deep_squeeze
      version: "1.0"
      entry_offsets: [0.0, 0.08, 0.14]
      allocations: [0.10, 0.30, 0.60]
      hard_stop_pct: 0.16
      scale_in_hours: 12
      horizon_hours: 24
      risk_multiplier: 0.50

account_monitor:
  enabled: true
  credentials_file: .env.binance-readonly
  poll_seconds: 15

execution:
  enabled: false
  live_activated: false
  environment: simulation
  manifest_path: artifacts/trading/cross_short_atr_v1.json
  enable_stop_loss: true
  sl_max_loss_usdt: 5.0
  sl_atr_multiplier: 3.0
  stop_loss_pct: 0.12
  enable_trailing_tp: true
  trailing_trigger_atr: 1.5
  trailing_callback_atr: 1.0
  max_hold_hours: 72
  require_price_confirmation: true

updater:
  # Production releases are applied only by the exact-SHA CI/CD workflow.
  enabled: false

fibo_trend_short:
  enabled: true
  higher_timeframes: ["4h", "1d"]
  confirm_timeframe: "1h"
  swing_lookback_bars: 30
  min_prior_pump_pct: 0.05
  min_impulse_drop_pct: 0.04
  fibo_entry_min: 0.500
  fibo_entry_max: 0.618
  fibo_watch_min: 0.382
  fibo_watch_max: 0.786
  fibo_invalidation_level: 1.000
  sl_mode: above_swing_high
  sl_atr_buffer: 0.20
  tp1_fibo_level: 0.000
  tp2_extension_level: 1.272
  tp3_extension_level: 1.618
  require_both_h1_conditions: false
  max_candidates: 60
  horizon_hours: 72
  telegram_enabled: true
  telegram_cooldown_minutes: 180
  telegram_require_qualified_short: true
  telegram_allowed_policies:
    - sniper_risk
    - sniper_horizon24
    - sniper_rr1_horizon24
    - elite_sniper_risk
  in_sample_end_utc: "2025-12-31T23:59:59+00:00"
