# ============================================================
# Đảo Vàng — Docker Compose
# ============================================================
# 2 services:
#   scanner: bộ quét 24/7 (poll Binance → score → Telegram alert)
#   web:     API server + React frontend (api_server.py port 8000)
# Shared volumes: data (DuckDB) + artifacts (frozen models)
# ============================================================

services:
  execution:
    profiles: ["trading"]
    build: .
    container_name: dao_vang_execution
    user: "${DAO_VANG_RUNTIME_UID:-1001}:${DAO_VANG_RUNTIME_GID:-1004}"
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - ./data:/app/data_live
      - ./artifacts:/app/artifacts:ro
      - ./configs:/app/configs:ro
    command: dao-vang execution start --config configs/live.yaml
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  scanner:
    build: .
    container_name: dao_vang_scanner
    user: "${DAO_VANG_RUNTIME_UID:-1001}:${DAO_VANG_RUNTIME_GID:-1004}"
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - ./data:/app/data_live
      - ./artifacts:/app/artifacts
      - ./configs:/app/configs
    command: >
      dao-vang scanner start --config configs/live.yaml
    healthcheck:
      test: ["CMD", "python", "/app/src/dao_vang/scanner/healthcheck.py", "--path", "/app/data_live/scanner_heartbeat.json", "--snapshot", "/app/data_live/candidate_snapshot.json", "--stats", "/app/data_live/system_data_stats.json"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  web:
    build: .
    container_name: dao_vang_web
    user: "${DAO_VANG_RUNTIME_UID:-1001}:${DAO_VANG_RUNTIME_GID:-1004}"
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - DAO_VANG_CONFIG_PATH=configs/live.yaml
      - DAO_VANG_PATHS__DATA_DIR=data_live
      - DAO_VANG_UPDATER__ENABLED=false
      - DAO_VANG_PATHS__RAW_DIR=data_live/raw
      - DAO_VANG_PATHS__NORMALIZED_DIR=data_live/normalized
      - DAO_VANG_SCANNER__DB_PATH=data_live/live.duckdb
      - DAO_VANG_SCANNER__WATCHLIST_PATH=data_live/watchlist.json
      - DAO_VANG_SCANNER__KILL_SWITCH_PATH=data_live/scanner_kill_switch.json
      - DAO_VANG_SCANNER__ROLLBACK_STATE_PATH=data_live/scanner_rollback.json
      - DAO_VANG_SCANNER__HEALTH_REPORT_PATH=data_live/scanner_health.json
      - DAO_VANG_CANDIDATE_COMPARISON__SNAPSHOT_PATH=data_live/candidate_filter_comparison.json
      - DAO_VANG_CANDIDATE_COMPARISON__STATE_PATH=data_live/candidate_filter_v2_state.json
      - DAO_VANG_SELF_LEARNING__STATE_PATH=artifacts/self_learning/live_state.json
      - DAO_VANG_SELF_LEARNING__REPORT_DIR=artifacts/self_learning/live_runs
    volumes:
      - ./data:/app/data_live
      - ./artifacts:/app/artifacts
      - ./configs:/app/configs
      - ./.git:/app/.git:ro
      - ./CHANGELOG.md:/app/CHANGELOG.md:ro
      - ./frontend/dist:/app/frontend/dist:ro
    depends_on:
      - scanner
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: dao_vang_cloudflared
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./cloudflared:/etc/cloudflared
    command: tunnel --protocol http2 --config /etc/cloudflared/config.yml run
    depends_on:
      - web
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
