binance:
  base_url: "https://fapi.binance.com"
  symbol: "BTCUSDT"
  interval: "5m"
  availability_lag_ms: 1000

collection:
  timeout_seconds: 15
  max_retries: 5
  max_concurrency: 2

paths:
  data_dir: "data"
  raw_dir: "data/raw"
  normalized_dir: "data/normalized"

web:
  # Địa chỉ người dùng mở được; Telegram sẽ nối thêm /#coin=SYMBOL.
  public_url: "http://127.0.0.1:8000"

coingecko:
  # Optional Binance-vs-CoinGecko price cross-reference only.
  enabled: false

coinmarketcap:
  # Standard CoinMarketCap metadata and market cap synced with Binance.
  enabled: true
  timeout_seconds: 10
  cache_minutes: 30

binance_agent_os:
  # Standard market-cap source for token size classification.
  enabled: true
  timeout_seconds: 10
  cache_minutes: 15
  chain_ids: "1,56,8453,CT_501"

telegram:
  # bot_token + chat_id từ env var: DAO_VANG_TELEGRAM__BOT_TOKEN / __CHAT_ID
  api_base: "https://api.telegram.org"
  timeout_seconds: 10
  max_retries: 3

scanner:
  enabled: false
  # research never sends; shadow Telegram is opt-in and labelled observation.
  operating_mode: research
  poll_interval_minutes: 5
  alert_flap_limit: 3
  alert_rearm_probability: 0.4
  max_coins: 150
  min_volume_usd: 1000000
  cooldown_minutes: 120
  telegram_cooldown_minutes: 120
  global_daily_alert_limit: 15
  coin_daily_alert_limit: 2
  shadow_telegram_enabled: false
  telegram_min_probability: 0.75
  telegram_min_volume_usd: 500000
  telegram_tiers: ["HIGH_CONFIDENCE"]
  telegram_digest_mode: true
  max_feature_age_minutes: 10
  min_data_quality_score: 0.8
  alert_levels: ["CAO", "TRUNG BÌNH"]
  # frozen_model_id: "frozen_20260803_..."  # set sau khi freeze model
  db_path: "data/dev.duckdb"
  artifact_dir: "artifacts"
  watchlist_path: "data/watchlist.json"
  kill_switch_path: "data/scanner_kill_switch.json"
  rollback_state_path: "data/scanner_rollback.json"
  health_report_path: "data/scanner_health.json"
  # Set explicitly for canary; null accepts the version declared by the bundle.
  threshold_policy_version: null
  max_heartbeat_age_minutes: 15
  drift_min_samples: 30
  drift_psi_warning: 0.10
  drift_psi_critical: 0.25
  history_days: 30

self_learning:
  # Creates/evaluates challengers; never changes scanner.frozen_model_id.
  enabled: false
  check_interval_cycles: 12
  min_training_outcomes: 200
  min_new_outcomes: 50
  min_positive_events: 20
  min_precision_improvement: 0.01
  max_recall_regression: 0.05
  max_brier_regression: 0.01
  recent_window_days: 14
  recent_sample_weight: 2.0
  historical_max_rows: 100000
  seed: 42
  state_path: "artifacts/self_learning/state.json"
  report_dir: "artifacts/self_learning/runs"

# Radar phát hiện hành vi bất thường độc lập với xác suất model.
# anomaly_score là điểm quan sát 0-100, không phải probability.
market_anomalies:
  enabled: true
  min_signal_score: 35.0
  volume_zscore_threshold: 2.5
  volume_ratio_1h_threshold: 1.8
  volume_percentile_threshold: 0.85
  funding_zscore_threshold: 2.0
  funding_change_8h_threshold: 0.0003
  funding_max_age_minutes: 720
  reversal_prior_return_threshold: 0.03
  reversal_current_return_threshold: 0.01
  oi_unwind_threshold: 0.03
  taker_buy_ratio_threshold: 0.45
  taker_ratio_change_threshold: 0.05
  crowded_long_ratio_threshold: 1.5

# Chạy song song bộ lọc hiện tại (champion) và bộ lọc thử nghiệm
# (challenger). Challenger chỉ ghi audit/outcome, tuyệt đối không gửi Telegram.
candidate_comparison:
  enabled: false
  champion_version: pump_filter_v1
  challenger_version: candidate_filter_v2
  universe_size: 150
  max_candidates: 30
  max_workers: 4
  decision_interval_minutes: 60
  outcome_check_interval_cycles: 12
  horizon_hours: 24
  target_drawdown: 0.20
  max_adverse_excursion: 0.16
  gap_tolerance_minutes: 15
  metrics_window_days: 30
  min_resolved: 200
  min_positive_events: 50
  min_evaluation_days: 14
  truth_event_gap_minutes: 240
  min_challenger_event_recall: 0.80
  precision_at_10_relative_gain: 0.10
  max_recall_regression: 0.05

# Router chon cach vao lenh, tach biet voi model phat hien tin hieu.
# "rules" la champion; doi sang "shadow_model" de ghi challenger ma khong tac dong quyet dinh.
execution_policy:
  enabled: true
  advisory_only: true
  router_version: scale_in_router_v1
  feature_schema_version: execution_profile_features_v1
  required_label_version: distribution_short_v2
  require_matching_label: true
  selector_mode: rules
  fallback_policy_id: scale_in_balanced
  compact_policy_id: scale_in_compact
  deep_policy_id: scale_in_deep_squeeze
  min_signal_score: 55.0
  min_quality_score: 80.0
  min_liquidity_score: 35.0
  compact_volatility_max: 60.0
  deep_volatility_min: 90.0
  deep_squeeze_min: 75.0
  deep_signal_min: 75.0
  skip_volatility_min: 97.0
  target_drawdown: 0.20
  templates:
    - policy_id: scale_in_compact
      version: "1.0"
      entry_offsets: [0.0, 0.03, 0.06]
      allocations: [0.20, 0.30, 0.50]
      hard_stop_pct: 0.12
      scale_in_hours: 6
      horizon_hours: 24
      risk_multiplier: 1.0
    - policy_id: scale_in_balanced
      version: "1.0"
      entry_offsets: [0.0, 0.05, 0.10]
      allocations: [0.20, 0.30, 0.50]
      hard_stop_pct: 0.16
      scale_in_hours: 6
      horizon_hours: 24
      risk_multiplier: 0.75
    - policy_id: scale_in_deep_squeeze
      version: "1.0"
      entry_offsets: [0.0, 0.08, 0.14]
      allocations: [0.10, 0.30, 0.60]
      hard_stop_pct: 0.16
      scale_in_hours: 12
      horizon_hours: 24
      risk_multiplier: 0.50

updater:
  enabled: true

# Tầng 2: Engine Tín hiệu Hành động Chính thức — Fibonacci Trend Short (H4/D1 -> H1 · v4.0.21)
# Ở chế độ research (Dev), telegram_enabled giữ false và bị chặn cứng bởi operating_mode.
fibo_trend_short:
  enabled: true
  universe_mode: rolling_pit_top50
  higher_timeframes: ["4h", "1d"]
  confirm_timeframe: "1h"
  max_candidates: 50
  horizon_hours: 72
  telegram_enabled: false
  telegram_cooldown_minutes: 180
  telegram_require_qualified_short: true
  telegram_min_prior_pump_pct: 0.05
  telegram_max_per_cycle: 3
  telegram_daily_limit: 12
  telegram_allowed_policies:
    - elite_sniper_risk
    - sniper_rr1_horizon24
    - sniper_risk
    - sniper_horizon24
  in_sample_end_utc: "2025-12-31T23:59:59+00:00"
